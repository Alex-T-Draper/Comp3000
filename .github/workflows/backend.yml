name: Backend CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: ['3.11']
    
    steps:
    - uses: actions/checkout@v5
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
        cache-dependency-path: 'Main/backend/NLP/requirements.txt'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        cd Main/backend/NLP
        pip install -r requirements.txt
    
    - name: Lint with flake8
      run: |
        pip install flake8
        # stop the build if there are Python syntax errors or undefined names
        flake8 Main/backend/NLP --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings
        flake8 Main/backend/NLP --count --exit-zero --max-line-length=127 --statistics
      continue-on-error: true
    
    - name: Run tests
      run: |
        cd Main/backend/NLP
        python -m pytest tests/ -v --tb=short
      continue-on-error: true
    
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: Main/backend/NLP/test_*.json
      continue-on-error: true

  build:
    needs: test
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v5
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: 'Main/backend/NLP/requirements.txt'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        cd Main/backend/NLP
        pip install -r requirements.txt
    
    - name: Build backend
      run: |
        echo "Backend dependencies installed and ready for deployment"
        python -m py_compile Main/backend/NLP/*.py
