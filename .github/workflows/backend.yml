name: Backend CI/CD

on:
  push:
    branches: [ main, develop ]
    paths: [ 'main/backend/**' ]
  pull_request:
    branches: [ main, develop ]
    paths: [ 'main/backend/**' ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: ['3.11']
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
        cache-dependency-path: 'main/backend/NLP/requirements.txt'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        cd main/backend/NLP
        pip install -r requirements.txt
    
    - name: Lint with flake8
      run: |
        pip install flake8
        # stop the build if there are Python syntax errors or undefined names
        flake8 main/backend/NLP --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings
        flake8 main/backend/NLP --count --exit-zero --max-line-length=127 --statistics
      continue-on-error: true
    
    - name: Run tests
      run: |
        cd main/backend/NLP
        python -m pytest test_models.py -v --tb=short
      continue-on-error: true
    
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: test-results
        path: main/backend/NLP/test_*.json
      continue-on-error: true

  build:
    needs: test
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: 'main/backend/NLP/requirements.txt'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        cd main/backend/NLP
        pip install -r requirements.txt
    
    - name: Build backend
      run: |
        echo "Backend dependencies installed and ready for deployment"
        python -m py_compile main/backend/NLP/*.py
