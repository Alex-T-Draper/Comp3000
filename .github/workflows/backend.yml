name: Backend CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    
    strategy:
      matrix:
        python-version: ['3.10']
    
    steps:
    - uses: actions/checkout@v5
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
        cache-dependency-path: 'Main/backend/NLP/requirements.txt'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Install CPU-only torch — avoids downloading multi-GB CUDA wheels on a CI runner
        pip install torch --index-url https://download.pytorch.org/whl/cpu
        # Strip the CUDA extra-index-url and the bare 'torch' entry so pip doesn't
        # re-resolve or upgrade torch from PyPI (which serves CUDA wheels by default)
        grep -Ev "(extra-index-url|^torch$)" Main/backend/NLP/requirements.txt > /tmp/ci-requirements.txt
        pip install -r /tmp/ci-requirements.txt
    
    - name: Lint with flake8
      run: |
        pip install flake8
        # stop the build if there are Python syntax errors or undefined names
        flake8 Main/backend/NLP --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings
        flake8 Main/backend/NLP --count --exit-zero --max-line-length=127 --statistics
      continue-on-error: true
    
    - name: Run tests
      run: |
        cd Main/backend/NLP
        python -m pytest tests/ -v --tb=short --junit-xml=test-results.xml
      continue-on-error: true
    
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: backend-test-results
        path: Main/backend/NLP/test-results.xml
      continue-on-error: true

  build:
    needs: test
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    
    steps:
    - uses: actions/checkout@v5
    
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'
        cache: 'pip'
        cache-dependency-path: 'Main/backend/NLP/requirements.txt'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install torch --index-url https://download.pytorch.org/whl/cpu
        grep -Ev "(extra-index-url|^torch$)" Main/backend/NLP/requirements.txt > /tmp/ci-requirements.txt
        pip install -r /tmp/ci-requirements.txt
    
    - name: Build backend
      run: |
        echo "Backend dependencies installed and ready for deployment"
        python -m py_compile Main/backend/NLP/*.py
