name: Frontend CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [22.x]
    
    steps:
    - uses: actions/checkout@v5
    
    - name: Set up Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v5
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: 'Main/frontend/package-lock.json'
    
    - name: Install dependencies
      run: |
        cd Main/frontend
        npm ci
    
    - name: Lint code
      run: |
        cd Main/frontend
        npm run lint
    
    - name: Run tests
      run: |
        cd Main/frontend
        npm run test:run
    
    - name: Type check
      run: |
        cd Main/frontend
        npx tsc --noEmit

  build:
    needs: test
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [22.x]
    
    steps:
    - uses: actions/checkout@v5
    
    - name: Set up Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v5
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: 'Main/frontend/package-lock.json'
    
    - name: Install dependencies
      run: |
        cd Main/frontend
        npm ci
    
    - name: Build production bundle
      run: |
        cd Main/frontend
        npm run build
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v6
      with:
        name: frontend-build
        path: Main/frontend/dist/
        retention-days: 7
