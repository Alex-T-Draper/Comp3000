<!-- src/app/components/tos-formatted/tos-formatted.html -->
<div class="tos-container">
  
  <!-- Header -->
  <div class="header">
    <h1>{{ tosTitle }}</h1>
    <p class="subtitle">Condition 3: Formatted Text</p>
  </div>

  <!-- Legend -->
  <div class="legend">
    <h3>Legend:</h3>
    <div class="legend-items">
      <div class="legend-item">
        <span class="highlight-sample high"></span>
        <span>High Risk</span>
      </div>
      <div class="legend-item">
        <span class="highlight-sample medium"></span>
        <span>Medium Risk</span>
      </div>
      <div class="legend-item">
        <strong class="bold-sample">Bold</strong>
        <span>Important</span>
      </div>
    </div>
  </div>

  <!-- ToS Document with Formatting -->
  <div class="tos-document" #tosContainer>
    <div class="tos-text" [innerHTML]="formattedHtml"></div>
  </div>

  <!-- Finish Button -->
  <div class="actions">
    <div class="actions-inner">
      <div class="actions-right">
        <button 
          class="btn-finish"
          (click)="finishReading()">
          ✓ Continue
        </button>
      </div>
    </div>
  </div>

</div>
