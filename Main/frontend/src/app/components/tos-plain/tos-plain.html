<!-- src/app/components/tos-plain/tos-plain.html -->
<div class="tos-container">
  
  <!-- Header -->
  <div class="header">
    <h1>{{ tosTitle }}</h1>
    <p class="subtitle">Condition 1: Standard Reading</p>
  </div>

  <!-- ToS Document -->
  <div class="tos-document" #tosContainer>
    <div class="tos-text">{{ tosText }}</div>
  </div>

  <!-- Finish Button -->
  <div class="actions">
    <div class="actions-inner">
      <div class="actions-right">
        <button 
          class="btn-finish"
          (click)="finishReading()">
          ✓ Continue
        </button>
      </div>
    </div>
  </div>

</div>
